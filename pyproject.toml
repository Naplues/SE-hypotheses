[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rfm-experiments"
version = "0.2.0"
description = "Construct RFM hypotheses and analyze completed coding-agent experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FSE2027 RFM authors"}]
dependencies = [
    "datasets>=5.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
download = ["datasets>=5.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/rfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "data/repo-archives",
    "data/repository-snapshots",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
